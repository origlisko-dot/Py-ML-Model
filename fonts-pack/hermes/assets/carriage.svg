<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" aria-hidden="true">
  <!-- Stylized carriage silhouette inspired by classic duc carriage iconography -->
  <g fill="currentColor">
    <!-- Carriage body -->
    <rect x="38" y="28" width="44" height="22" rx="2"/>
    <rect x="42" y="24" width="36" height="6" rx="1"/>
    <!-- Wheels -->
    <circle cx="48" cy="54" r="8" stroke="currentColor" stroke-width="3" fill="none"/>
    <circle cx="72" cy="54" r="8" stroke="currentColor" stroke-width="3" fill="none"/>
  </g>
  <!-- Horse -->
  <g fill="currentColor">
    <ellipse cx="22" cy="48" rx="10" ry="6"/>
    <rect x="14" y="38" width="6" height="14" rx="2"/>
    <rect x="22" y="36" width="5" height="16" rx="2"/>
    <rect x="28" y="38" width="5" height="14" rx="2"/>
    <rect x="34" y="40" width="4" height="12" rx="1"/>
    <circle cx="12" cy="36" r="4"/>
    <path d="M8 34 L4 28 L8 30 Z"/>
  </g>
  <!-- Driver -->
  <g fill="currentColor">
    <rect x="52" y="14" width="4" height="12" rx="1"/>
    <circle cx="54" cy="11" r="3"/>
    <rect x="50" y="24" width="8" height="6" rx="1"/>
  </g>
</svg>
