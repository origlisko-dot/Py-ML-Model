# Model 1 — multi-timeframe technical analysis. Hyperparameters.

data:
  base_timeframe: 5m         # timeframe at which decisions/labels are formed
  context_timeframes: [5m, 15m, 1h, 1d]  # timeframes fed to the model
  window: 64                 # bars of history per timeframe fed to the encoder
  horizon: 12                # bars ahead for the label (in base_timeframe units)

labeling:
  method: triple_barrier
  take_profit_atr: 2.0       # upper barrier = entry + tp * ATR
  stop_loss_atr: 1.0         # lower barrier = entry - sl * ATR
  atr_window: 14

network:
  encoder: tcn               # tcn | transformer
  d_model: 64
  n_heads: 4
  encoder_layers: 2
  dropout: 0.1

train:
  batch_size: 128
  max_epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.2          # temporal (walk-forward) split, no shuffling
  early_stopping_patience: 4
  num_workers: 0
  loss: focal                # ce | focal (focal focuses on hard, ambiguous bars)
  focal_gamma: 1.5

walk_forward:
  n_splits: 4                # rolling out-of-sample folds for validation
  expanding: true            # expanding train window (vs fixed rolling)

tune:
  n_trials: 20               # Optuna trials (requires: uv sync --extra tune)
  timeout_seconds: 0         # 0 = no timeout

baseline:
  # LightGBM on flattened multi-timeframe features.
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1

risk:
  method: fixed_fractional   # fixed_fractional | kelly | vol_target
  risk_pct: 0.01             # fraction of equity risked per trade
  rr_ratio: 2.0              # take-profit / stop distance
  stop_atr_mult: 1.5         # hard stop distance in ATRs
  max_position_pct: 0.25     # notional cap per position
  kelly_multiplier: 0.5      # fractional-Kelly damping (method=kelly)
  target_volatility: 0.01    # equity-vol target (method=vol_target)
  trail_atr_mult: 0.0        # >0 enables an ATR trailing stop
  portfolio:
    enabled: false           # enable portfolio-level constraints
    max_concurrent_positions: 5
    max_total_risk_pct: 0.06
    max_symbol_exposure_pct: 0.25
    max_daily_loss_pct: 0.03
    max_correlation: 0.8

costs:
  # Realistic trading costs (retail equities). Applied when `backtest --costs`
  # (on by default). Fills are adverse; commission is charged per side.
  commission_per_share: 0.005  # $ per share, per side
  commission_pct: 0.0          # fraction of notional, per side
  min_commission: 1.0          # minimum commission, per side
  slippage_bps: 1.0            # adverse price move, bps, per side
  half_spread_bps: 1.0         # half bid/ask spread, bps, per side
