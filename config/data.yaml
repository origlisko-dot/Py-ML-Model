# Data ingestion configuration: symbols, timeframes, active provider.

provider: yfinance          # yfinance | ibkr

symbols:
  - AAPL
  - MSFT
  - NVDA

# Timeframes to ingest and align. Canonical labels used across the codebase.
# Higher timeframes are resampled from the base timeframe where a provider
# lacks native support (see features/multi_timeframe.py).
timeframes:
  - 1m
  - 5m
  - 15m
  - 1h
  - 1d

# History window per timeframe. Intraday history is limited by providers
# (yfinance caps 1m at ~30 days); ingestion clamps requests accordingly.
history:
  1m: 30d
  5m: 60d
  15m: 60d
  1h: 730d
  1d: 3650d

ibkr:
  # Chunked historical downloads to respect IBKR pacing limits.
  chunk: 1W                 # download window per request
  throttle_seconds: 10.0    # min delay between historical requests
  max_retries: 3
